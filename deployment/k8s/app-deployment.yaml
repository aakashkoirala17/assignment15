apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant-backend
  labels:
    app: ai-assistant-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-assistant-backend
  template:
    metadata:
      labels:
        app: ai-assistant-backend
    spec:
      containers:
        - name: backend
          image: ai-assistant-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: LLM_PROVIDER
              value: "gemini"
            - name: RATE_LIMIT_REQUESTS_PER_MINUTE
              value: "120"
            - name: ENABLE_CACHE
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant-backend-service
spec:
  selector:
    app: ai-assistant-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant-frontend
  labels:
    app: ai-assistant-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-assistant-frontend
  template:
    metadata:
      labels:
        app: ai-assistant-frontend
    spec:
      containers:
        - name: frontend
          image: ai-assistant-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          env:
            - name: BACKEND_URL
              value: "http://ai-assistant-backend-service:8000"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant-frontend-service
spec:
  selector:
    app: ai-assistant-frontend
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
  type: LoadBalancer
